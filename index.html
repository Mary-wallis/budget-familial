<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Familial</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏡 Budget Familial</h1>
    </header>

    <div class="dashboard">

        <div class="stat-card">
            <h3>💰 Revenus</h3>
            <p id="revenusTotal">0 €</p>
        </div>

        <div class="stat-card">
            <h3>📄 Dépenses</h3>
            <p id="depensesTotal">0 €</p>
        </div>

        <div class="stat-card">
            <h3>💵 Reste</h3>
            <p id="resteTotal">0 €</p>
        </div>

        <div class="stat-card">
            <h3>🏦 Épargne</h3>
            <p id="epargneTotal">0 €</p>
        </div>

    </div>

    <div class="card">

        <h2>💼 Revenus</h2>
<label>Mois</label>

<select id="mois">
    <option>Janvier</option>
    <option>Février</option>
    <option>Mars</option>
    <option>Avril</option>
    <option>Mai</option>
    <option>Juin</option>
    <option>Juillet</option>
    <option>Août</option>
    <option>Septembre</option>
    <option>Octobre</option>
    <option>Novembre</option>
    <option>Décembre</option>
</select>
<label>Année</label>

<select id="annee">
    <option>2026</option>
    <option>2027</option>
    <option>2028</option>
    <option>2029</option>
    <option>2030</option>
</select>
        <label>Salaire</label>
        <input type="number" id="salaire">

        <label>Salaire Mari</label>
        <input type="number" id="salaireMari">

        <label>Autres Revenus</label>
        <input type="number" id="autresRevenus">

    </div>

    <div class="card">

        <h2>🐷 Tirelire Familiale</h2>

        <label>Montant actuel</label>
        <input type="number" id="especes">

    </div>

    <div class="card">

        <h2>📄 Factures</h2>

        <label>Eau</label>
        <input type="number" class="depense">

        <label>Électricité</label>
        <input type="number" class="depense">

        <label>Internet</label>
        <input type="number" class="depense">

        <label>Netflix</label>
        <input type="number" class="depense">

        <label>iCloud+</label>
        <input type="number" class="depense">

        <label>Disney+</label>
        <input type="number" class="depense">

        <label>Carte BeBunk</label>
        <input type="number" class="depense">

        <label>BNP</label>
        <input type="number" class="depense">

        <label>Autre Dépense 1</label>
        <input type="number" class="depense">

        <label>Autre Dépense 2</label>
        <input type="number" class="depense">

        <label>Autre Dépense 3</label>
        <input type="number" class="depense">

    </div>

    <div class="card">

        <h2>🛒 Courses</h2>

        <input type="number" id="courses"
            placeholder="Montant des courses">

    </div>
<div class="card">

    <h2>🐷 Dépôt dans la tirelire</h2>

    <select id="personneDepot">
        <option>Moi</option>
        <option>Mari</option>
        <option>Fils</option>
    </select>

    <input
        type="number"
        id="montantDepot"
        placeholder="Montant">

    <button onclick="ajouterDepot()">
        Ajouter dépôt
    </button>

    <ul id="historiqueTirelire"></ul>

</div><div class="card">

    <h2>🛒 Historique Courses</h2>

    <input
        type="text"
        id="magasinCourse"
        placeholder="Magasin">

    <input
        type="number"
        id="montantCourse"
        placeholder="Montant">

    <button onclick="ajouterCourse()">
        Ajouter Course
    </button>

    <ul id="historiqueCourses"></ul>

</div>
    <button onclick="calculer()">
        📊 Calculer le budget
    </button>
<button onclick="enregistrerMois()">
    💾 Enregistrer le mois

    <button onclick="testFirestore()">
    ☁️ Test Firestore
</button>
<div class="card">

    <h2>📊 Historique Mensuel</h2>

    <table id="tableHistorique">

        <thead>
            <tr>
                <th>Année</th>
                <th>Mois</th>
                <th>Revenus</th>
                <th>Dépenses</th>
                <th>Épargne</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody></tbody>

    </table>

</div>
    <script type="module" src="firebase.js"></script>
<script src="script.js"></script>

</body>

</html>
